[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Open Software"]
publish = false

[workspace.dependencies]
clovy-api = { path = "crates/api" }
clovy-config = { path = "crates/config" }
clovy-domain = { path = "crates/domain" }
clovy-persistence = { path = "crates/persistence" }
clovy-providers = { path = "crates/providers" }
clovy-services = { path = "crates/services" }

async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = "0.3"
hound = "3.5"
jsonwebtoken = "9"
sha2 = "0.11"
# Share store (JUN-308): the first persistent state in clovy-api. rustls only —
# this binary runs inside a TEE with no OpenSSL.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
# Pure-Rust MP4/M4A parser used for duration probing on the /v1/dictate
# path, where the desktop helper records AAC-in-MPEG-4. Hound is WAV-only.
mp4 = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
# Pure-Rust, offline trigram language detector used to fill in the transcript
# language server-side (Venice ASR never returns one). No network or model
# downloads, so it is safe to run inside the TEE.
whatlang = "0.18"
zeroize = { version = "1", features = ["derive"] }

criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
pretty_assertions = "1"
rstest = "0.26"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
incremental = true
