[package]
name = "clovy"
version = "0.0.40"
description = "Clovy"
authors = ["Open Software Network"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
# Two binaries below; `cargo run` (tauri dev via scripts/cargo-clovy-runner.sh)
# must keep launching the app.
default-run = "os-june"

[lib]
name = "clovy_lib"
crate-type = ["rlib"]

[[bin]]
name = "os-june"
path = "src/main.rs"

# The native messaging shim Chrome spawns for the Clovy extension (JUN-287).
# Not auto-bundled: scripts/bundle-nm-shim.sh copies and signs it into
# .tauri-helper/ before bundling (see tauri.macos.conf.json).
[[bin]]
name = "clovy-nm-shim"
path = "src/bin/clovy_nm_shim.rs"
required-features = ["helper-binaries"]

[[bin]]
name = "clovy-computer-use-driver"
path = "src/computer_use_driver.rs"
required-features = ["helper-binaries"]

# Tauri bundles every Cargo binary whose required features appear in its
# explicit feature list. Keep helper binaries enabled for ordinary Cargo
# builds and tests via the default feature, while excluding them from Tauri's
# app executable list so the signed resource copies remain authoritative.
[features]
default = ["helper-binaries"]
helper-binaries = []

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cpal = "0.15"
dotenvy = "0.15"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hound = "3.5"
imagesize = "0.13"
# fd plumbing (pipe/dup2) for the managed browser's CDP pipe transport.
libc = "0.2"
# Strips the Windows `\\?\` verbatim path prefix canonicalize() adds so it
# never leaks into config.yaml or the UI. No-op on non-Windows.
dunce = "1.0"
clovy-companion-crypto = { path = "../crates/clovy-companion-crypto" }
clovy-companion-protocol = { path = "../crates/clovy-companion-protocol" }
rand = "0.8"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
# Pure-Rust FFT for the echo-rejection similarity gate (GCC-PHAT lag estimation).
rustfft = "6.2"
# Matches the version tauri-plugin-updater resolves, so the version_comparator
# closure can name the same `semver::Version` the updater hands it.
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
# Avoid the SQLx umbrella crate here. Its optional macro/database dependencies
# put unused MySQL/Postgres packages into Cargo.lock and cargo-audit.
# sqlx-sqlite does not expose a public runtime-tokio feature in SQLx 0.8.x, so
# the direct sqlx-core dependency intentionally enables its runtime hook.
sqlx = { package = "sqlx-core", version = "0.8", default-features = false, features = ["_rt-tokio", "chrono", "uuid"] }
sqlx-sqlite = { version = "0.8", default-features = false, features = ["bundled", "chrono", "uuid"] }
tauri = { version = "2.8.0", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
thiserror = "2.0"
tempfile = "3.14"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
# Untrusted URL parsing for the managed browser's public-web policy.
url = "2"
urlencoding = "2"
uuid = { version = "1.11", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "=4.2.0", default-features = false }
tauri-plugin-autostart = "2.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# screencapturekit supports >=0.6,<0.9, but apple-metal 0.6.1+ references
# macOS 26 SDK symbols that do not compile on Clovy's macOS 15/Xcode 16 lane.
apple-metal = { version = "=0.8.8", default-features = false }
core-foundation = "0.10"
keyring = { version = "3", features = ["apple-native"] }
block2 = "0.6"
cua-driver-core = { git = "https://github.com/trycua/cua", rev = "51582fd2ad8cffb68b2c6c81077d391132d7a0e1" }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }
window-vibrancy = "0.6"
platform-macos = { git = "https://github.com/trycua/cua", rev = "51582fd2ad8cffb68b2c6c81077d391132d7a0e1" }
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
