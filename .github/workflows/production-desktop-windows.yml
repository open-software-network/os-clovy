name: production-desktop-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing semver release to attach Windows assets to (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-desktop-windows
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build production Windows app
    runs-on: blacksmith-4vcpu-windows-2025
    environment: production
    steps:
      - name: Mint release token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: open-software-network
          repositories: ${{ github.event.repository.name }},os-june-releases

      # Read which source commit the stable macOS release was built from (no
      # checkout needed yet) so Windows rebuilds that exact tree rather than
      # whatever main has since advanced to. Also validates the version input.
      - name: Resolve stable source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:VERSION_INPUT -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Version must be semver X.Y.Z with no leading zeros, got: $env:VERSION_INPUT"
          }

          $metaDir = Join-Path $env:RUNNER_TEMP "stable-meta"
          New-Item -ItemType Directory -Force -Path $metaDir | Out-Null
          gh release download "v$env:VERSION_INPUT" --repo open-software-network/os-june-releases --pattern "stable-build.json" --dir $metaDir
          if ($LASTEXITCODE -ne 0) {
            throw "Release v$env:VERSION_INPUT does not include stable-build.json. Promote the macOS release first, then attach Windows assets for the same version."
          }

          $meta = Get-Content -Raw (Join-Path $metaDir "stable-build.json") | ConvertFrom-Json
          if ($meta.version -ne $env:VERSION_INPUT) {
            throw "stable-build.json version is $($meta.version), expected $env:VERSION_INPUT."
          }
          if ($meta.commit -notmatch '^[0-9a-f]{40}$') {
            throw "stable-build.json commit is not a 40-char sha: $($meta.commit)"
          }

          "VERSION=$env:VERSION_INPUT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STABLE_COMMIT=$($meta.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the promoted macOS release was built from, so the
          # Windows installer ships the same tested source under the same version.
          ref: ${{ env.STABLE_COMMIT }}
          fetch-depth: 0

      # The stable source commit can predate the local setup action, so load
      # the policy from the immutable commit that started this workflow.
      - name: Checkout package manager policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .pnpm-policy

      - name: Setup pnpm
        uses: ./.pnpm-policy/.github/actions/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate release secrets
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          PRODUCTION_OS_ACCOUNTS_URL: ${{ secrets.PRODUCTION_OS_ACCOUNTS_URL }}
          PRODUCTION_OS_ACCOUNTS_API_URL: ${{ secrets.PRODUCTION_OS_ACCOUNTS_API_URL }}
          PRODUCTION_OS_ACCOUNTS_CLIENT_ID: ${{ secrets.PRODUCTION_OS_ACCOUNTS_CLIENT_ID }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_ID }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET }}
          PRODUCTION_CLOVY_API_URL: ${{ secrets.PRODUCTION_CLOVY_API_URL || secrets.PRODUCTION_JUNE_API_URL }}
          PRODUCTION_LINEAR_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_LINEAR_OAUTH_CLIENT_ID }}
        run: |
          $missing = 0
          $required = @(
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "TAURI_SIGNING_PRIVATE_KEY",
            "RELEASE_APP_ID",
            "RELEASE_APP_PRIVATE_KEY",
            "PRODUCTION_OS_ACCOUNTS_URL",
            "PRODUCTION_OS_ACCOUNTS_API_URL",
            "PRODUCTION_OS_ACCOUNTS_CLIENT_ID",
            "PRODUCTION_GOOGLE_OAUTH_CLIENT_ID",
            "PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET",
            "PRODUCTION_CLOVY_API_URL",
            "PRODUCTION_LINEAR_OAUTH_CLIENT_ID"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Host "::error::$name is required for a production Windows release."
              $missing = 1
            }
          }

          exit $missing

      - name: Stamp clean release version
        shell: pwsh
        run: |
          # The checked-out commit still carries the RC's version files; stamp the
          # clean X.Y.Z so the Windows build matches the promoted macOS version.
          node .pnpm-policy/scripts/set-build-version.mjs $env:VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Version stamping failed."
          }

          cargo metadata `
            --manifest-path src-tauri/Cargo.toml `
            --locked `
            --no-deps `
            --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Stamped Cargo metadata validation failed."
          }

      - name: Verify release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release view "v$env:VERSION" --repo open-software-network/os-june-releases
          if ($LASTEXITCODE -ne 0) {
            throw "Release v$env:VERSION does not exist in open-software-network/os-june-releases."
          }

          $manifestDir = Join-Path $env:RUNNER_TEMP "release-manifest"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          gh release download "v$env:VERSION" --repo open-software-network/os-june-releases --pattern "latest.json" --dir $manifestDir
          if ($LASTEXITCODE -ne 0) {
            throw "Release v$env:VERSION does not include latest.json. Run the production macOS release before attaching Windows assets."
          }

          $manifestPath = Join-Path $manifestDir "latest.json"
          if (!(Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Downloaded latest.json was not found at $manifestPath."
          }
          "RELEASE_MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Build agent runtime
        shell: pwsh
        env:
          CLOVY_AGENT_RUNTIME_TARGET: windows
          JUNE_AGENT_RUNTIME_TARGET: windows
        run: |
          pnpm agent-runtime:build
          node scripts/build-agent-runtime.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Agent runtime SEA build failed."
          }

      - name: Sign and smoke test agent runtime
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $canonicalRuntime = ".tauri-agent-runtime/clovy-agent-runtime.exe"
          $legacyRuntime = ".tauri-agent-runtime/june-agent-runtime.exe"
          $hasCanonical = Test-Path -LiteralPath $canonicalRuntime -PathType Leaf
          $hasLegacy = Test-Path -LiteralPath $legacyRuntime -PathType Leaf
          if ($hasCanonical -and $hasLegacy) {
            $canonicalHash = (Get-FileHash -Algorithm SHA256 $canonicalRuntime).Hash
            $legacyHash = (Get-FileHash -Algorithm SHA256 $legacyRuntime).Hash
            $canonicalChecksum = (Get-Content -Raw "$canonicalRuntime.sha256").Trim()
            $legacyChecksum = (Get-Content -Raw "$legacyRuntime.sha256").Trim()
            if ($canonicalHash -cne $legacyHash -or $canonicalChecksum -cne $legacyChecksum) {
              throw "Canonical and legacy agent runtime outputs differ."
            }
            throw "Canonical and legacy agent runtime outputs are both present; signing one would make the prebuilt outputs diverge."
          } elseif ($hasCanonical) {
            $runtime = Get-Item $canonicalRuntime -ErrorAction Stop
          } elseif ($hasLegacy) {
            $runtime = Get-Item $legacyRuntime -ErrorAction Stop
          } else {
            throw "Agent runtime build produced neither canonical nor legacy output."
          }
          ./scripts/windows-sign.ps1 $runtime.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Agent runtime signing failed."
          }
          $signature = Get-AuthenticodeSignature -FilePath $runtime.FullName
          if ($signature.Status -ne "Valid") {
            throw "Agent runtime signature is $($signature.Status). $($signature.StatusMessage)"
          }
          $digest = (Get-FileHash -Algorithm SHA256 $runtime.FullName).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($runtime.FullName).sha256" -Value $digest -NoNewline
          $smokeDir = Join-Path $env:RUNNER_TEMP "Clovy agent runtime smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $smokeRuntime = Join-Path $smokeDir "clovy-agent-runtime.exe"
          Copy-Item -LiteralPath $runtime.FullName -Destination $smokeRuntime -Force
          node scripts/build-agent-runtime.mjs --smoke $smokeRuntime
          if ($LASTEXITCODE -ne 0) {
            throw "Signed agent runtime smoke test failed."
          }

      - name: Build production Windows installer
        env:
          OS_ACCOUNTS_URL: ${{ secrets.PRODUCTION_OS_ACCOUNTS_URL }}
          OS_ACCOUNTS_API_URL: ${{ secrets.PRODUCTION_OS_ACCOUNTS_API_URL }}
          OS_ACCOUNTS_CLIENT_ID: ${{ secrets.PRODUCTION_OS_ACCOUNTS_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET }}
          CLOVY_API_URL: ${{ secrets.PRODUCTION_CLOVY_API_URL || secrets.PRODUCTION_JUNE_API_URL }}
          LINEAR_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_LINEAR_OAUTH_CLIENT_ID }}
          # Match macOS: new installs start in Auto at Higher Quality.
          OS_CLOVY_AUTO_MODE_DEFAULT: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
          CLOVY_AGENT_RUNTIME_PREBUILT: "1"
          JUNE_AGENT_RUNTIME_PREBUILT: "1"
          CLOVY_AGENT_RUNTIME_TARGET: windows
          JUNE_AGENT_RUNTIME_TARGET: windows
        run: pnpm tauri:build

      - name: Verify Windows signatures and payload
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/os-june.exe" -ErrorAction Stop
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup.exe was not produced."
          }
          $setupSig = Get-Item "$($setup.FullName).sig" -ErrorAction Stop

          foreach ($file in @($exe, $setup)) {
            if ($file.Length -le 0) {
              throw "$($file.FullName) is empty."
            }
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Authenticode signature is $($signature.Status) for $($file.FullName). $($signature.StatusMessage)"
            }
          }

          if ([string]::IsNullOrWhiteSpace((Get-Content -Raw $setupSig.FullName))) {
            throw "$($setupSig.FullName) is empty."
          }

          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (!(Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not installed at $sevenZip."
          }

          $listing = & $sevenZip l $setup.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect NSIS installer payload."
          }
          $listingText = ($listing -join "`n").Replace("\", "/")
          function Test-ArchivePath([string]$path) {
            $escapedPath = [regex]::Escape($path.Replace("\", "/"))
            return $listingText -match "(?m)(?:^|\s)$escapedPath(?:\s|$)"
          }
          # The MSVC target statically links WebView2Loader; only GNU builds ship its DLL.
          if (!(Test-ArchivePath "os-june.exe")) {
            throw "NSIS installer payload does not include os-june.exe."
          }
          $canonicalRuntime = "native/bin/clovy-agent-runtime.exe"
          $legacyRuntime = "native/bin/june-agent-runtime.exe"
          $hasCanonicalRuntime = Test-ArchivePath $canonicalRuntime
          $hasLegacyRuntime = Test-ArchivePath $legacyRuntime
          if ($hasCanonicalRuntime -and $hasLegacyRuntime) {
            throw "NSIS installer payload contains both canonical and legacy agent runtimes; their bytes cannot be safely disambiguated from the listing."
          } elseif ($hasCanonicalRuntime) {
            $packagedRuntime = $canonicalRuntime
          } elseif ($hasLegacyRuntime) {
            $packagedRuntime = $legacyRuntime
          } else {
            throw "NSIS installer payload includes neither canonical nor legacy agent runtime."
          }
          foreach ($expected in @($packagedRuntime, "$packagedRuntime.sha256", "native/bin/june-dictation-helper.exe")) {
            if (!(Test-ArchivePath $expected)) {
              throw "NSIS installer payload does not include bundled file $expected."
            }
          }
          foreach ($forbidden in @("native/hermes", "python.exe", ".pyd", "hermes-agent")) {
            if ($listingText -match [regex]::Escape($forbidden)) {
              throw "NSIS installer payload still includes forbidden Hermes or Python content: $forbidden."
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clovy-windows-production-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Publish Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $nsisDir -Filter "*-setup.exe" | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup.exe was not produced."
          }

          $setupSig = Get-Item "$($setup.FullName).sig" -ErrorAction Stop
          $canonicalVersionedSetup = Join-Path $env:RUNNER_TEMP "Clovy_$($env:VERSION)_x64-setup.exe"
          $canonicalVersionedSetupSig = "$canonicalVersionedSetup.sig"
          $stableSetup = Join-Path $env:RUNNER_TEMP "Clovy_x64-setup.exe"
          $stableSetupSig = Join-Path $env:RUNNER_TEMP "Clovy_x64-setup.exe.sig"
          $legacyStableSetup = Join-Path $env:RUNNER_TEMP "June_x64-setup.exe"
          $legacyStableSetupSig = Join-Path $env:RUNNER_TEMP "June_x64-setup.exe.sig"
          Copy-Item -LiteralPath $setup.FullName -Destination $canonicalVersionedSetup -Force
          Copy-Item -LiteralPath $setupSig.FullName -Destination $canonicalVersionedSetupSig -Force
          Copy-Item -LiteralPath $setup.FullName -Destination $stableSetup -Force
          Copy-Item -LiteralPath $setupSig.FullName -Destination $stableSetupSig -Force
          Copy-Item -LiteralPath $setup.FullName -Destination $legacyStableSetup -Force
          Copy-Item -LiteralPath $setupSig.FullName -Destination $legacyStableSetupSig -Force

          $manifest = Get-Content -Raw $env:RELEASE_MANIFEST_PATH | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION -and $manifest.version -ne "v$env:VERSION") {
            throw "latest.json version is $($manifest.version), expected $env:VERSION."
          }
          if ($null -eq $manifest.platforms) {
            $manifest | Add-Member -MemberType NoteProperty -Name "platforms" -Value ([pscustomobject]@{})
          }

          $assetName = [System.Uri]::EscapeDataString((Split-Path -Leaf $canonicalVersionedSetup))
          $assetUrl = "https://github.com/open-software-network/os-june-releases/releases/download/v$env:VERSION/$assetName"
          $signature = (Get-Content -Raw $setupSig.FullName).Trim()
          $manifest.platforms | Add-Member -Force -MemberType NoteProperty -Name "windows-x86_64" -Value ([pscustomobject]@{
            signature = $signature
            url = $assetUrl
          })

          $manifest | ConvertTo-Json -Depth 20 | Set-Content -Path $env:RELEASE_MANIFEST_PATH -Encoding utf8

          $assets = @(
            $setup.FullName,
            $setupSig.FullName,
            $canonicalVersionedSetup,
            $canonicalVersionedSetupSig,
            $stableSetup,
            $stableSetupSig,
            $legacyStableSetup,
            $legacyStableSetupSig,
            $env:RELEASE_MANIFEST_PATH
          )
          foreach ($asset in $assets | Select-Object -Unique) {
            gh release upload "v$env:VERSION" $asset --repo open-software-network/os-june-releases --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $asset."
            }
          }

      - name: Summary
        shell: pwsh
        run: |
          @(
            "### Production Windows release",
            "- Version: ``$env:VERSION``",
            "- Release repo: ``open-software-network/os-june-releases``",
            "- Marketing download: ``https://github.com/open-software-network/os-june-releases/releases/latest/download/Clovy_x64-setup.exe``",
            "- Updater platform key: ``windows-x86_64``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
