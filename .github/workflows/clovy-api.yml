name: clovy-api

on:
  pull_request:
    paths:
      - "clovy-api/**"
      - "crates/clovy-companion-protocol/**"
      - ".github/workflows/clovy-api.yml"
      - ".github/actions/setup-rust/**"
  push:
    branches: [main]
    paths:
      - "clovy-api/**"
      - "crates/clovy-companion-protocol/**"
      - ".github/workflows/clovy-api.yml"
      - ".github/actions/setup-rust/**"

permissions:
  contents: read

concurrency:
  group: clovy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: cargo fmt
        working-directory: clovy-api
        run: cargo fmt --all -- --check

  clippy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: cargo clippy
        working-directory: clovy-api
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      # Also part of the full run below; the named step makes a shipped-client
      # compatibility break unmissable in the check list. See ADR 0021.
      - name: client contract suite
        working-directory: clovy-api
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p clovy-api --test client_contract --locked
      - name: cargo test
        working-directory: clovy-api
        env:
          RUST_BACKTRACE: 1
        run: cargo test --all-targets --all-features --locked

# The coverage rerun of this suite lives in coverage.yml (manual-only): it
# rebuilt and reran everything `test` already ran, gated nothing
# (continue-on-error), and produced an artifact nothing downloads.
