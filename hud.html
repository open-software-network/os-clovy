<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clovy Dictation</title>
  </head>
  <body>
    <div id="hud" class="hud" data-state="idle">
      <button
        id="hud-cancel"
        class="hud-cancel"
        type="button"
        aria-label="Cancel dictation"
      ></button>
      <span id="hud-target" class="hud-target" role="img" hidden>
        <img alt="" draggable="false" hidden />
        <span class="hud-target-fallback" aria-hidden="true"></span>
      </span>
      <div class="hud-viz">
        <div class="hud-bars" aria-hidden="true">
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
          <span class="hud-bar"></span>
        </div>
      </div>
      <span id="hud-esc-tip" class="hud-esc-tip" aria-hidden="true">Esc</span>
      <span id="hud-spinner" class="hud-spinner" aria-hidden="true"></span>
      <span class="hud-error-icon" aria-hidden="true"></span>
      <span class="hud-error-layer" aria-hidden="true">
        <span id="hud-error-text" class="hud-error-message"></span>
      </span>
      <span class="hud-meeting-body">
        <span class="hud-meeting-mark" aria-hidden="true"></span>
        <span class="hud-meeting-text">
          <span id="hud-meeting-label" class="hud-meeting-label"
            >Meeting detected</span
          >
          <span id="hud-meeting-app" class="hud-meeting-app"></span>
          <button id="hud-meeting-video" class="hud-meeting-video" type="button" role="switch" aria-checked="false" aria-describedby="hud-meeting-app" hidden>
            <span class="hud-meeting-video-toggle" aria-hidden="true"></span>
            <span id="hud-meeting-video-label"></span>
          </button>
        </span>
      </span>
      <button id="hud-meeting-start" class="hud-meeting-start" type="button">
        <span class="hud-meeting-start-icon" aria-hidden="true"></span>
        Record
      </button>
      <button
        id="hud-meeting-dismiss"
        class="hud-meeting-dismiss"
        type="button"
        aria-label="Dismiss meeting prompt"
      ></button>
      <button
        id="hud-stop"
        class="hud-stop"
        type="button"
        aria-label="Stop dictation"
      >
        <span class="hud-stop-glyph" aria-hidden="true"></span>
      </button>
      <span id="hud-status" class="hud-status">Idle</span>
    </div>
    <script type="module" src="/src/hud.ts"></script>
  </body>
</html>
